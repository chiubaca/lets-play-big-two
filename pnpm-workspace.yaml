  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  concurrently: ^9.2.1
  drizzle-kit: ^0.31.8
  drizzle-orm: 0.45.1
  hono: ^4.7.0
  nanoid: ^5.1.6
  next-themes: ^0.4.6
  radix-ui: ^1.4.3
  shadcn: ^4.2.0
  sonner: ^2.0.7
